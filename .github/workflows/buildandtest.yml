name: .NET Build, Test, and Publish Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [linux-x64, win-x64, osx-x64]
        archive_ext: [tar.gz, zip] 

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup .NET
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: Build the project
      - name: Build the project
        run: dotnet build --no-restore --configuration Release

      # Step 5: Run tests
      #- name: Run tests
      #  run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx"

      # Step 6: Publish the project
      - name: Publish the project
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-manual-$(date +%Y%m%d%H%M%S)}"
          release_name="App-$tag-${{ matrix.target }}"
          # Build for net8.0
          dotnet publish src/Chirp.Web/Chirp.Razor.Web.csproj -f net8.0 -r "${{ matrix.target }}" -c Release -o "$release_name"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            # Windows runner has 7zip built in
            7z a -tzip "${release_name}.zip" "./${release_name}/*" >/dev/null
          else
            tar czf "${release_name}.tar.gz" "$release_name"
          fi

          rm -rf "$release_name"

      # Step 7: Upload artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            App-*-${{ matrix.target }}.zip
            App-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error